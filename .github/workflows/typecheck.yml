name: Typecheck

# GitHub-hosted runners live on datacenter IP ranges that the live API blocks outright
# (every endpoint returns 403 from a GitHub Actions runner, confirmed by an actual run —
# not just geo-filtered content, session/catalog endpoints too). So this workflow only
# type-checks the suite as a fast pre-merge signal; running it against the real API stays
# a local/manual `npm test` until CI can reach the API from an allowed network (see
# README.md's CI section for the options that were considered).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck
